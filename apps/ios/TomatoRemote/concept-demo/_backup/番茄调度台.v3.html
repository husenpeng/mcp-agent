<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>番茄调度台 · TomatoRemote 概念演示</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='18' r='12' fill='%23E23B22'/%3E%3Cpath d='M16 6c-2 0-4 1-5 3 2 0 3 .5 5 .5S19 9 21 9c-1-2-3-3-5-3z' fill='%23337A4D'/%3E%3C/svg%3E">
<style>
/* ===== tokens ===== */
:root{
  --paper:#FCF6F0; --card:#FFFDFA; --ink:#26140C; --mute:#8C7263; --faint:#BBA392;
  --line:#F0DFD4; --rail:#E8D2C4;
  --tomato:#E23B22; --tomato-deep:#B02510;
  --wash:linear-gradient(135deg,#FFE9DD 0%,#FBD9CB 55%,#F7E3D4 100%); --wash-line:#F3CDBB;
  --leaf:#35855A; --leaf-wash:#EAF2E2;
  --amber:#C2610A; --amber-wash:#FBEBD6;
  --code:#2B130C; --code-ink:#F6EDE4; --code-bar:#C9A18E;
  --grad:linear-gradient(135deg,#FF8A4C 0%,#F4502C 34%,#D82C12 68%,#AE1F0A 100%);
  --head-grad:linear-gradient(100deg,#26140C 0%,#6E2412 52%,#C2401F 100%);
  --ambient:radial-gradient(820px 460px at 10% -6%,rgba(255,122,69,.16),transparent 62%),radial-gradient(680px 400px at 92% -2%,rgba(255,176,64,.14),transparent 60%);
  --phone-bg:linear-gradient(180deg,#FFFAF5 0%,#FCF4EC 34%,#FAF0E7 100%);
  --grid-c:rgba(210,42,18,.05); --dock-tint:rgba(255,122,69,.07);
  --glow:0 12px 32px -14px rgba(210,42,18,.55); --glow-c:rgba(210,42,18,.40);
  --shadow:0 1px 2px rgba(38,20,12,.05),0 8px 24px -18px rgba(38,20,12,.28);
  --r-card:18px; --r-small:12px;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
[data-theme="dark"]{
  --paper:#150C07; --card:#22140C; --ink:#F8ECE2; --mute:#BC9E8C; --faint:#86695A;
  --line:#3B2418; --rail:#4A2E1E;
  --tomato:#FF6A4D; --tomato-deep:#FF8A70;
  --wash:linear-gradient(135deg,#4A2114 0%,#3A1A10 55%,#31150C 100%); --wash-line:#5E3122;
  --leaf:#86C79A; --leaf-wash:#21301F;
  --amber:#E8A050; --amber-wash:#33290F;
  --code:#170B06; --code-ink:#EFE5DA; --code-bar:#B08A76;
  --grad:linear-gradient(135deg,#FF9A5C 0%,#FF6A3D 36%,#F04E2E 70%,#C22A10 100%);
  --head-grad:linear-gradient(100deg,#FFF3EA 0%,#FFC0A8 55%,#FF6A4D 100%);
  --ambient:radial-gradient(820px 460px at 10% -6%,rgba(255,90,60,.12),transparent 62%),radial-gradient(680px 400px at 92% -2%,rgba(255,150,60,.08),transparent 60%);
  --phone-bg:linear-gradient(180deg,#20130B 0%,#180E08 40%,#140B06 100%);
  --grid-c:rgba(255,122,69,.05); --dock-tint:rgba(255,106,77,.08);
  --glow:0 12px 32px -14px rgba(255,90,60,.35); --glow-c:rgba(255,90,60,.30);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.55;font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
svg{display:block;flex:none}
::selection{background:var(--wash)}

/* ===== studio shell ===== */
.studio{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 12px}
.studio-bar{width:min(430px,100%);display:flex;align-items:center;gap:10px}
.studio-bar .mark{width:26px;height:26px;border-radius:8px;background:var(--tomato);display:grid;place-items:center;color:#fff}
.studio-bar h1{font-size:15px;font-weight:700;letter-spacing:.2px}
.studio-bar .note{font-size:12px;color:var(--faint);margin-left:auto}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mute);border:1px solid var(--line);background:var(--card)}
.icon-btn:active{transform:scale(.94)}
.phone{width:min(430px,100%);height:min(900px,calc(100vh - 96px));min-height:560px;background:var(--paper);border:1px solid var(--line);border-radius:38px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;position:relative}
@media (max-width:520px){
  .studio{padding:0;gap:0}
  .studio-bar{display:none}
  .phone{width:100%;height:100vh;height:100dvh;min-height:0;border:0;border-radius:0;box-shadow:none}
}
.screen{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.pad{padding:18px 18px 26px}

/* ===== type ===== */
.display{font-size:30px;line-height:1.22;font-weight:800;letter-spacing:-.4px}
.h2{font-size:16px;font-weight:700;letter-spacing:.1px}
.sub{font-size:13px;color:var(--mute)}
.micro{font-size:12px;color:var(--faint)}
.num{font-variant-numeric:tabular-nums}

/* ===== masthead ===== */
.masthead{padding:22px 18px 6px}
.masthead .date{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--mute);font-weight:600}
.masthead .date .dot{width:7px;height:7px;border-radius:50%;background:var(--leaf);align-self:center}
.masthead .display{margin-top:8px}
.masthead .lede{margin-top:8px;font-size:14px;color:var(--mute);max-width:34ch}

/* ===== live block ===== */
.live{margin:16px 18px 0;background:var(--tomato);color:#fff;border-radius:var(--r-card);padding:16px;display:block;width:calc(100% - 36px);text-align:left;position:relative;overflow:hidden}
[data-theme="dark"] .live{color:#20100C}
.live:active{transform:scale(.985)}
.live .top{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.4px;opacity:.92}
.pulse{width:8px;height:8px;border-radius:50%;background:currentColor;position:relative}
.pulse::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid currentColor;opacity:.5;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(.5);opacity:.7}100%{transform:scale(1.25);opacity:0}}
.live .title{display:block;margin-top:8px;font-size:18px;font-weight:800;line-height:1.3}
.live .ticker{display:block;margin-top:6px;font-size:13px;opacity:.9;min-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live .meter{margin-top:12px;display:flex;align-items:center;gap:10px}
.live .bar{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.32);overflow:hidden}
[data-theme="dark"] .live .bar{background:rgba(32,16,12,.25)}
.live .bar i{display:block;height:100%;background:currentColor;border-radius:2px}
.live .round{font-size:12px;font-weight:700}
.live .go{position:absolute;right:14px;top:14px;opacity:.85}

/* ===== sections & vine ===== */
.section{margin-top:22px}
.section-head{display:flex;align-items:baseline;gap:8px;padding:0 18px;margin-bottom:10px}
.section-head .h2{flex:1}
.section-head .link{font-size:13px;font-weight:600;color:var(--tomato);min-height:32px;display:flex;align-items:center}
.vine{position:relative;margin:0 18px;padding-left:26px}
.vine::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:var(--rail);border-radius:1px}
.node{position:relative;padding:8px 0}
.node::before{content:"";position:absolute;left:-22px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--faint)}
.node.done::before{background:var(--leaf);border-color:var(--leaf)}
.node.open::before{background:var(--card);border-color:var(--tomato)}
.node.live::before{background:var(--tomato);border-color:var(--tomato)}
.node .t{font-size:15px;font-weight:600}
.node .d{font-size:13px;color:var(--mute);margin-top:2px}
.node .when{font-size:12px;color:var(--faint);margin-top:2px}

/* ===== rows / cards ===== */
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);min-height:56px}
.row + .row{margin-top:8px}
.row:active{transform:scale(.985)}
.row .grow{flex:1;min-width:0}
.row .t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.chip-ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--wash);color:var(--tomato)}
.chip-ico.neutral{background:var(--paper);color:var(--mute)}
.chip-ico.leaf{background:var(--leaf-wash);color:var(--leaf)}
.chev{color:var(--faint)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--paper);color:var(--mute);border:1px solid var(--line)}
.pill.run{background:var(--wash);color:var(--tomato-deep);border-color:var(--wash-line)}
.pill.ok{background:var(--leaf-wash);color:var(--leaf);border-color:transparent}
.pill.bad{background:var(--wash);color:var(--tomato-deep);border-color:var(--wash-line)}
.pill.warn{background:var(--amber-wash);color:var(--amber);border-color:transparent}

/* ===== plain history ===== */
.plain{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:10px 4px;min-height:48px}
.plain + .plain{border-top:1px solid var(--line)}
.plain .ico{color:var(--faint);margin-top:2px}
.plain .grow{flex:1;min-width:0}
.plain .t{font-size:15px;font-weight:600}
.plain .d{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plain .when{font-size:12px;color:var(--faint);flex:none;margin-top:2px}

/* ===== group header ===== */
.group{display:flex;align-items:center;gap:8px;margin:18px 18px 8px;font-size:13px;font-weight:700;color:var(--mute)}
.group .count{margin-left:auto;font-weight:600;color:var(--faint)}

/* ===== buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:14px;font-size:14px;font-weight:700;background:var(--tomato);color:#fff}
[data-theme="dark"] .btn{color:#20100C}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.small{min-height:36px;padding:0 12px;font-size:13px;border-radius:11px}
.btn.leaf{background:var(--leaf);color:#fff}
.btn.danger-ghost{background:var(--card);color:var(--tomato-deep);border:1px solid var(--wash-line)}

/* ===== memory ===== */
.filters{display:flex;gap:8px;padding:0 18px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;color:var(--mute)}
.fchip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mem{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:14px;margin:0 18px 10px}
.mem.cand{background:var(--wash);border-color:var(--wash-line)}
.mem .kind{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--tomato-deep)}
.mem .kind .scope{margin-left:auto;font-weight:600;color:var(--mute);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.mem .val{margin-top:6px;font-size:15px;font-weight:600;line-height:1.5}
.mem .acts{display:flex;gap:8px;margin-top:12px}
.mem .meta{margin-top:8px;font-size:12px;color:var(--faint)}

/* ===== chat ===== */
.chat-head{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--paper);border-bottom:1px solid var(--line)}
.chat-head .back{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink)}
.chat-head .ttl{flex:1;min-width:0;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.transcript{padding:16px 18px 20px;display:flex;flex-direction:column;gap:16px}
.say-user{align-self:flex-end;max-width:82%;background:var(--wash);border:1px solid var(--wash-line);color:var(--ink);border-radius:16px 16px 4px 16px;padding:10px 14px;font-size:15px}
.turn{display:flex;gap:10px}
.turn .rail{flex:none;width:26px;display:flex;flex-direction:column;align-items:center}
.turn .rail .seed{width:26px;height:26px;border-radius:9px;background:var(--wash);color:var(--tomato);display:grid;place-items:center}
.turn .rail .stem{flex:1;width:2px;background:var(--rail);margin-top:6px;border-radius:1px}
.turn .body{flex:1;min-width:0}
.turn .who{font-size:12px;font-weight:700;color:var(--mute);margin-bottom:6px}
.turn .prose{font-size:15px;line-height:1.65}
.turn .prose h3{font-size:16px;font-weight:800;margin:10px 0 4px}
.turn .prose p{margin:6px 0}
.turn .prose ul{margin:6px 0 6px 18px}
.fold{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;color:var(--mute);margin:4px 0}
.fold .st{width:7px;height:7px;border-radius:50%;background:var(--leaf)}
.fold.run .st{background:var(--tomato);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}
.steps{border-left:2px solid var(--rail);margin:6px 0 6px 6px;padding-left:12px;display:flex;flex-direction:column;gap:6px}
.step{font-size:13px;color:var(--mute)}
.step b{color:var(--ink);font-weight:600}
.code{background:var(--code);color:var(--code-ink);border-radius:14px;overflow:hidden;margin:8px 0}
.code .bar{display:flex;align-items:center;padding:8px 12px;font-size:12px;font-weight:700;letter-spacing:.6px;color:#B9AE9F;border-bottom:1px solid rgba(255,255,255,.08)}
.code .bar button{margin-left:auto;color:#B9AE9F;min-height:32px;min-width:32px;display:grid;place-items:center;border-radius:8px}
.code pre{padding:12px 14px;font-size:13px;line-height:1.6;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.diagram{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;margin:8px 0;position:relative}
.diagram button.zoom{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;color:var(--mute)}
.composer{position:sticky;bottom:0;z-index:6;border-top:1px solid var(--line);background:var(--card);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.composer .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:8px}
.composer .chips::-webkit-scrollbar{display:none}
.cchip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:12px;font-weight:600;color:var(--mute)}
.composer .line{display:flex;align-items:flex-end;gap:8px}
.composer textarea{flex:1;min-height:44px;max-height:120px;resize:none;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:11px 12px;font-size:16px;line-height:1.4;outline:none}
.composer textarea:focus{border-color:var(--wash-line)}
.send{width:44px;height:44px;border-radius:14px;background:var(--tomato);color:#fff;display:grid;place-items:center}
[data-theme="dark"] .send{color:#20100C}
.send:disabled{background:var(--line);color:var(--faint)}
.typing{display:inline-flex;gap:4px;align-items:center;height:20px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}

/* ===== chat layout fix & usage ===== */
.screen.chat-mode{display:flex;flex-direction:column;overflow:hidden}
.screen.chat-mode .chat-head{position:static;flex:none}
.screen.chat-mode .usage{flex:none}
.screen.chat-mode .transcript{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.screen.chat-mode .transcript::-webkit-scrollbar{display:none}
.screen.chat-mode .composer{position:static;flex:none}
.usage{display:flex;align-items:center;gap:8px;width:calc(100% - 36px);margin:10px 18px 0;padding:8px 12px;border:1px solid var(--wash-line);border-radius:12px;background:var(--wash);color:var(--mute);font-size:12px;font-weight:600;text-align:left}
.usage:active{transform:scale(.99)}
.usage i{font-style:normal;color:var(--tomato-deep);font-weight:800}
.usage em{font-style:normal;margin-left:auto;color:var(--faint);font-weight:500;white-space:nowrap}
.usage svg:last-child{color:var(--faint)}
.turn-u{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;font-weight:600;color:var(--faint)}
.turn-u svg{color:var(--tomato)}
.utable{width:100%;table-layout:fixed;border-collapse:collapse;font-size:13px;margin-top:6px}
.utable th{text-align:left;font-size:12px;color:var(--faint);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
.utable td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.utable th:not(:first-child),.utable td:not(:first-child){text-align:right}
.utable tr.total td{font-weight:800;color:var(--tomato-deep);border-bottom:0}
.row .grow .t,.row .grow .d,.row .grow .micro,.plain .grow .t,.plain .grow .d,.opt .grow .t,.opt .grow .d{display:block}
.row .grow .micro{margin-top:2px}
.fchip.on{background:var(--tomato);color:#fff;border-color:var(--tomato)}
[data-theme="dark"] .fchip.on{color:#20100C}
.section-head .h2{position:relative;padding-left:12px}
.section-head .h2::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:4px;height:14px;border-radius:2px;background:var(--tomato)}
.group svg{color:var(--tomato)}
.search:focus-within{border-color:var(--wash-line)}
.composer textarea:focus{border-color:var(--tomato)}

/* ===== dock ===== */
.dock{flex:none;display:flex;border-top:1px solid var(--line);background:var(--card);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;border-radius:14px;color:var(--faint);min-height:52px}
.tab span{font-size:11px;font-weight:600}
.tab.on{color:var(--tomato)}
.tab.on span{font-weight:800}
.tab .ind{width:4px;height:4px;border-radius:50%;background:transparent;margin-top:1px}
.tab.on .ind{background:var(--tomato)}

/* ===== sheet / toast ===== */
.scrim{position:absolute;inset:0;background:rgba(20,16,12,.42);z-index:20;display:none}
.scrim.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:22px 22px 0 0;padding:14px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(102%);transition:transform .26s cubic-bezier(.3,.8,.3,1);max-height:76%;overflow-y:auto}
.sheet.on{transform:translateY(0)}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-size:17px;font-weight:800;margin-bottom:4px}
.sheet .sub{margin-bottom:12px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 12px;border-radius:14px;border:1px solid var(--line);background:var(--paper);min-height:48px}
.opt + .opt{margin-top:8px}
.opt .grow{flex:1;min-width:0}
.opt .t{font-size:15px;font-weight:600}
.opt .d{font-size:12px;color:var(--mute)}
.opt.on{border-color:var(--tomato);background:var(--wash)}
.opt .tick{color:var(--tomato)}
.toast{position:absolute;left:50%;bottom:86px;transform:translate(-50%,16px);z-index:30;background:var(--ink);color:var(--paper);font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.22s;white-space:nowrap;max-width:88%;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== misc ===== */
.search{display:flex;align-items:center;gap:8px;margin:0 18px 4px;padding:0 12px;min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:14px;color:var(--faint)}
.search input{flex:1;border:0;outline:none;background:none;font-size:16px;min-width:0}
.empty{padding:40px 24px;text-align:center;color:var(--mute)}
.empty .box{width:54px;height:54px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 12px;color:var(--faint)}
.empty .t{font-size:16px;font-weight:700;color:var(--ink)}
.empty .d{font-size:13px;margin-top:6px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--mute)}
.kv .v{font-weight:600;text-align:right}
.switch{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:.2s;flex:none}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--tomato)}
.switch.on i{left:21px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background:var(--tomato)}
.avatar.a2{background:var(--leaf)}.avatar.a3{background:var(--amber)}.avatar.a4{background:var(--mute)}
.stack{display:flex}
.stack .avatar{border:2px solid var(--card);margin-left:-10px}
.stack .avatar:first-child{margin-left:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== gradient warm-red tech theme ===== */
body{background-color:var(--paper);background-image:var(--ambient);background-attachment:fixed}
::selection{background:var(--wash-line)}
.phone{background:var(--phone-bg);box-shadow:var(--shadow),0 24px 70px -34px var(--glow-c)}
.phone::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(var(--grid-c) 1px,transparent 1px);background-size:18px 18px}
.phone>.screen,.phone>.dock{position:relative;z-index:1}
.masthead .display{background-image:var(--head-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.live{background-image:var(--grad);box-shadow:var(--glow)}
.live::before{content:"";position:absolute;inset:0;z-index:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:22px 22px}
.live::after{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.16) 46%,transparent 62%)}
.live>*{position:relative;z-index:1}
.btn{background-image:var(--grad);box-shadow:0 8px 20px -10px var(--glow-c)}
.btn.ghost,.btn.danger-ghost,.btn.leaf{background-image:none;box-shadow:none}
.send{background-image:var(--grad);box-shadow:0 8px 20px -10px var(--glow-c)}
.send:disabled{background-image:none;box-shadow:none}
.switch.on{background-image:var(--grad)}
.avatar{background-image:var(--grad)}
.avatar.a2,.avatar.a3,.avatar.a4{background-image:none}
[data-theme="dark"] .avatar,[data-theme="dark"] .studio-bar .mark{color:#20100C}
.studio-bar .mark{background-image:var(--grad)}
.fchip.on{background-image:var(--grad);border-color:transparent}
.section-head .h2::before{background-image:var(--grad)}
.tab.on .ind{width:16px;height:3px;border-radius:2px;background-image:var(--grad)}
.dock{background-image:linear-gradient(180deg,var(--dock-tint),transparent 46%)}
.sheet{background-image:linear-gradient(180deg,var(--dock-tint),transparent 140px)}
.chat-head{background-image:linear-gradient(180deg,var(--dock-tint),transparent)}
.code .bar{color:var(--code-bar)}
</style>

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
let toastTimer=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('on'),1800);}
function openSheet(html){$('#sheet').innerHTML='<div class="grab"></div>'+html;$('#sheet').classList.add('on');$('#scrim').classList.add('on');}
function closeSheet(){$('#sheet').classList.remove('on');$('#scrim').classList.remove('on');}
$('#scrim').addEventListener('click',closeSheet);
function go(r){S.route=r;render();$('#screen').scrollTop=0;}

/* ===== shared fragments ===== */
function pill(state){
  if(state==='running'||state==='active')return '<span class="pill run">'+icoFill('bolt',12)+'进行中</span>';
  if(state==='done'||state==='idle')return '<span class="pill ok">'+ico('check',12)+'完成</span>';
  if(state==='tripped'||state==='failed')return '<span class="pill bad">'+ico('x',12)+'熔断</span>';
  if(state==='paused')return '<span class="pill warn">'+ico('pause',12)+'暂停</span>';
  return '<span class="pill">'+esc(state)+'</span>';
}
function mdToHtml(md){
  return md.split('\n').map(line=>{
    if(line.startsWith('## '))return '<h3>'+esc(line.slice(3))+'</h3>';
    if(line.startsWith('### '))return '<h3>'+esc(line.slice(4))+'</h3>';
    if(line.startsWith('- '))return '<ul><li>'+esc(line.slice(2))+'</li></ul>';
    if(line.trim()==='')return '';
    return '<p>'+esc(line)+'</p>';
  }).join('').replace(/<\/ul><ul>/g,'');
}

/* ===== view: chat ===== */
function chatBody(id){
  const evs=DB.chats[id]||[];
  let h='';
  evs.forEach((e,i)=>{
    if(e.role==='user'){h+='<div class="say-user">'+esc(e.text)+'</div>';return;}
    if(e.role==='tools'){
      const key=id+'-'+i, open=S.folded[key];
      h+='<div class="turn"><div class="rail"><span class="seed">'+ico('cpu',14)+'</span><span class="stem"></span></div><div class="body">'
      +'<button class="fold'+(e.done?'':' run')+'" onclick="toggleFold(\''+key+'\')"><span class="st"></span>'+e.steps.length+' 步工作过程'+ico(open?'x':'chev',14)+'</button>'
      +(open?'<div class="steps">'+e.steps.map(s=>'<div class="step"><b>'+esc(s[0])+'</b> · '+esc(s[1])+'</div>').join('')+'</div>':'')
      +'</div></div>';return;
    }
    if(e.role==='code'){
      h+='<div class="turn"><div class="rail"><span class="seed">'+ico('spark',14)+'</span><span class="stem"></span></div><div class="body"><div class="code"><div class="bar">'+esc(e.lang)+'<button onclick="copyCode(this,\''+id+'-'+i+'\')" aria-label="复制代码">'+ico('copy',16)+'</button></div><pre id="code-'+id+'-'+i+'">'+esc(e.code)+'</pre></div></div></div>';return;
    }
    if(e.role==='diagram'){
      h+='<div class="turn"><div class="rail"><span class="seed">'+ico('spark',14)+'</span><span class="stem"></span></div><div class="body"><div class="diagram"><button class="zoom" onclick="zoomDiagram()" aria-label="放大流程图">'+ico('expand',15)+'</button>'+diagramSvg()+'</div></div></div>';return;
    }
    h+='<div class="turn"><div class="rail"><span class="seed">'+ico('spark',14)+'</span><span class="stem"></span></div><div class="body"><div class="who">Tomato</div><div class="prose">'+mdToHtml(e.md)+'</div>'+(e.u?turnU(e.u):'')+'</div></div>';
  });
  if(S.streaming&&S.streaming.session===id){
    h+='<div class="turn"><div class="rail"><span class="seed">'+ico('spark',14)+'</span><span class="stem"></span></div><div class="body"><div class="who">Tomato</div><div class="prose" id="stream">'+(S.streaming.text?esc(S.streaming.text):'<span class="typing"><i></i><i></i><i></i></span>')+'</div>'+turnU(S.streaming.u,'streamU')+'</div></div>';
  }
  return h;
}

/* ===== usage helpers ===== */
function fmtTok(n){return n>=1000?(n/1000).toFixed(1)+'k':String(n);}
function fmtCost(c){return '¥'+c.toFixed(2);}
function usageOf(id){const s=DB.sessions.find(x=>x.id===id);return (s&&s.usage)||{tin:0,tout:0,cost:0,turns:0,tools:0,secs:0};}
function usageBarHtml(id){const u=usageOf(id);return '<button class="usage" id="usageBar" onclick="usageSheet(\''+id+'\')" aria-label="查看用量记录">'+ico('chart',14)+'<span class="num">↑ '+fmtTok(u.tin)+' · ↓ '+fmtTok(u.tout)+' tokens</span><i class="num">'+fmtCost(u.cost)+'</i><em class="num">'+u.turns+' 轮 · '+u.tools+' 工具 · '+Math.max(1,Math.round(u.secs/60))+' 分钟</em>'+ico('chev',13)+'</button>';}
function turnU(u,id){return '<div class="turn-u num"'+(id?' id="'+id+'"':'')+'>'+ico('chart',12)+'↑ '+fmtTok(u.tin)+' · ↓ '+fmtTok(u.tout)+' tokens · '+fmtCost(u.cost)+' · '+u.secs+'s</div>';}
function usageSheet(id){
  const s=DB.sessions.find(x=>x.id===id);const u=usageOf(id);
  const turns=(DB.chats[id]||[]).filter(e=>e.role==='agent'&&e.u);
  openSheet('<h3>用量记录</h3><p class="sub">'+esc(s?s.title:'对话')+' · '+esc(S.model)+'</p>'
  +'<table class="utable"><colgroup><col style="width:34%"><col style="width:22%"><col style="width:22%"><col style="width:22%"></colgroup><thead><tr><th>回合</th><th>输入</th><th>输出</th><th>费用</th></tr></thead><tbody>'
  +turns.map((e,i)=>'<tr><td>第 '+(i+1)+' 回合 · '+e.u.secs+'s</td><td class="num">'+fmtTok(e.u.tin)+'</td><td class="num">'+fmtTok(e.u.tout)+'</td><td class="num">'+fmtCost(e.u.cost)+'</td></tr>').join('')
  +'<tr class="total"><td>合计</td><td class="num">'+fmtTok(u.tin)+'</td><td class="num">'+fmtTok(u.tout)+'</td><td class="num">'+fmtCost(u.cost)+'</td></tr></tbody></table>'
  +'<div class="kv"><span class="k">对话轮次</span><span class="v num">'+u.turns+'</span></div>'
  +'<div class="kv"><span class="k">工具调用</span><span class="v num">'+u.tools+' 次</span></div>'
  +'<div class="kv"><span class="k">累计耗时</span><span class="v num">'+Math.max(1,Math.round(u.secs/60))+' 分钟</span></div>'
  +'<p class="micro" style="margin-top:10px">合计含工具调用与系统提示开销；按 Tomato 1 示例计价（输入 ¥0.02/千 tokens、输出 ¥0.06/千 tokens）。</p>'
  +'<div style="display:flex;gap:8px;margin-top:14px"><button class="btn ghost" style="flex:1" onclick="toast(\'演示中：导出用量\')">导出</button><button class="btn" style="flex:1" onclick="closeSheet()">关闭</button></div>');
}

/* ===== actions ===== */
function openChat(id){S.autoscroll=true;go('chat/'+id);}
function setQuery(v){S.query=v;const sc=$('#screen');const top=sc.scrollTop;render();sc.scrollTop=top;const inp=sc.querySelector('.search input');if(inp){inp.focus();inp.setSelectionRange(v.length,v.length);}}
function setMemFilter(f){S.memFilter=f;render();}
function toggleFold(k){S.folded[k]=!S.folded[k];render();}
function confirmMem(id){const m=DB.memories.find(x=>x.id===id);if(m){m.status='active';toast('已确认，Agent 会记住这条');render();}}
function forgetMem(id){const i=DB.memories.findIndex(x=>x.id===id);if(i>-1){DB.memories.splice(i,1);toast('已删除这条记忆');render();}}
function toggleTask(id){const t=DB.tasks.find(x=>x.id===id);if(t){t.on=!t.on;toast(t.on?'已开启：'+t.title:'已暂停：'+t.title);render();}}
function runRobot(id){const r=DB.robots.find(x=>x.id===id);if(!r)return;if(r.state==='running'){r.state='idle';r.last='上次：中断 · 刚刚';toast('已中断 '+r.name);}else{r.state='running';r.last='这次运行：执行中 · 刚刚';toast('已启动 '+r.name);}closeSheet();render();}
function pickModel(v){S.model=v;closeSheet();toast('模型已切换为 '+v);render();}
function pickPerm(v){S.perm=v;closeSheet();toast('权限已切换为 '+v);render();}
function toggleNotify(){S.notify=!S.notify;toast(S.notify?'通知已开启':'通知已关闭');render();}
function toggleDark(){S.dark=!S.dark;document.documentElement.dataset.theme=S.dark?'dark':'light';paintThemeBtn();toast(S.dark?'已切换深色':'已切换浅色');render();}
function paintThemeBtn(){$('#themeBtn').innerHTML=ico(S.dark?'sun':'moon',18);}
function autoGrow(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';}
function copyCode(btn,key){const pre=document.getElementById('code-'+key);if(!pre)return;const txt=pre.textContent;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast('代码已复制'),()=>toast('复制失败'));}else{toast('代码已复制');}}
function sendMsg(id){
  const ta=$('#draft');const text=(ta.value||'').trim();if(!text){toast('先写点什么');return;}
  DB.chats[id]=DB.chats[id]||[];DB.chats[id].push({role:'user',text});
  const full='收到。我会在 Mac 上处理「'+text+'」，完成后在这里给你结论和改动清单。';
  S.streaming={session:id,text:'',full:full,u:{tin:0,tout:0,cost:0,secs:0}};
  S.autoscroll=true;render();
  let i=0;
  const timer=setInterval(()=>{
    i+=2;S.streaming.text=full.slice(0,i);
    const u=S.streaming.u;u.tin+=37;u.tout+=11;u.cost=Math.round((u.cost+0.0006)*10000)/10000;u.secs=Math.max(1,Math.round(i*0.02));
    const node=document.getElementById('stream');if(node)node.textContent=S.streaming.text;
    const ub=document.getElementById('usageBar');if(ub)ub.outerHTML=usageBarHtml(id);
    const su=document.getElementById('streamU');if(su)su.outerHTML=turnU(u,'streamU');
    const tr=$('#screen .transcript');if(tr)tr.scrollTop=tr.scrollHeight;
    if(i>=full.length){clearInterval(timer);
      DB.chats[id].push({role:'agent',md:S.streaming.full,u:u});
      const sess=DB.sessions.find(x=>x.id===id);
      if(sess&&sess.usage){sess.usage.tin+=u.tin;sess.usage.tout+=u.tout;sess.usage.cost=Math.round((sess.usage.cost+u.cost)*100)/100;sess.usage.turns+=1;sess.usage.tools+=2;sess.usage.secs+=u.secs;}
      S.streaming=null;S.autoscroll=true;render();}
  },40);
}

/* ===== router & dock ===== */
const TABS=[['home','今天','spark'],['sessions','会话','bubble'],['robots','智能体','cpu'],['rooms','群聊','people'],['account','我的','person']];
function baseOf(r){return r.startsWith('chat/')?'sessions':r==='memory'?'account':r;}
function renderDock(){
  const base=baseOf(S.route);
  $('#dock').innerHTML=TABS.map(t=>'<button class="tab'+(base===t[0]?' on':'')+'" onclick="go(\''+t[0]+'\')" aria-label="'+t[1]+'">'+ico(t[2],22)+'<span>'+t[1]+'</span><span class="ind"></span></button>').join('');
}
function render(){
  const r=S.route;let h;
  if(r.startsWith('chat/'))h=viewChat(r.slice(5));
  else if(r==='sessions')h=viewSessions();
  else if(r==='memory')h=viewMemory();
  else if(r==='robots')h=viewRobots();
  else if(r==='rooms')h=viewRooms();
  else if(r==='account')h=viewAccount();
  else h=viewHome();
  const sc=$('#screen');
  const oldTr=sc.querySelector('.transcript');const keep=oldTr?oldTr.scrollTop:null;
  sc.innerHTML=h;
  const chat=r.startsWith('chat/');
  sc.classList.toggle('chat-mode',chat);
  renderDock();
  if(chat){const tr=sc.querySelector('.transcript');if(tr)tr.scrollTop=S.autoscroll?tr.scrollHeight:(keep==null?tr.scrollHeight:keep);S.autoscroll=false;}
}
/* live ticker */
let tickIdx=0;
setInterval(()=>{const el=document.getElementById('ticker');if(!el)return;tickIdx=(tickIdx+1)%DB.live.tools.length;el.textContent=DB.live.tools[tickIdx];},2200);
/* init */
$('#markIco').innerHTML=icoFill('spark',15);
paintThemeBtn();
$('#themeBtn').addEventListener('click',toggleDark);
S.route=location.hash.replace('#/','')||'home';
render();
</script>
</body>
