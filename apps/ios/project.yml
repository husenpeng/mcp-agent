name: TomatoRemote

options:
  bundleIdPrefix: ai.tomato
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.4"
    CURRENT_PROJECT_VERSION: "5"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    # Sampler/harness sessions already run inside `sandbox-exec`, so the Swift
    # driver cannot apply its own nested sandbox around macro plugins and the
    # whole SwiftUI property-wrapper family fails to expand. Disabling the
    # driver sandbox keeps macro expansion working in that environment.
    OTHER_SWIFT_FLAGS: "-disable-sandbox"
    # Pin the personal team this build installs with, so `⌘R` and
    # `-allowProvisioningUpdates` do not need a manual Team selection.
    DEVELOPMENT_TEAM: XA4Y65F4M9

targets:
  TomatoRemote:
    type: application
    platform: iOS
    sources:
      - path: TomatoRemote
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.tomato.remote
        PRODUCT_NAME: TomatoRemote
        INFOPLIST_FILE: TomatoRemote/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        # Simulator builds need no identity; a device build must sign, so the
        # exemption stays scoped to the simulator SDK and Xcode can sign with the
        # team chosen in Signing & Capabilities.
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: NO
        CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]: NO
        CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: ""
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        DEVELOPMENT_ASSET_PATHS: ""
    scheme:
      testTargets:
        - TomatoRemoteUITests
      gatherCoverageData: false

  TomatoRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TomatoRemoteUITests
    dependencies:
      - target: TomatoRemote
    settings:
      base:
        TEST_TARGET_NAME: TomatoRemote
        PRODUCT_BUNDLE_IDENTIFIER: ai.tomato.remote.uitests
        GENERATE_INFOPLIST_FILE: YES
