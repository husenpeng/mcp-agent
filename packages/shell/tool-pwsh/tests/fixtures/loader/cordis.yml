# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@tomato/system-prompt'

- id: fs
  name: '@tomato/fs-local'

- id: session-projections
  name: '@tomato/session-projection'

- id: working-directory
  name: '@tomato/working-directory'

- id: tools
  name: '@tomato/tools'

- id: tool-executor-native
  name: '@tomato/tool-executor-native'

- id: subprocess
  name: '@tomato/subprocess-local'

- id: bash
  name: '@tomato/pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@tomato/shell-env'

- id: tasks
  name: '@tomato/jobs-local'

- id: tool-jobs
  name: '@tomato/tool-jobs'

- id: tool-pwsh
  name: '@tomato/tool-pwsh'
