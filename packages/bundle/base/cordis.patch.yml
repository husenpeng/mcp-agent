# The @tomato/base bundle patch: the shared core of each base-backed profile, applied as
# ONE insert over the empty profile root. Later bundle patches and the user's
# profile cordis.patch.yml address these rows by id, with the last write
# winning per row.
#
# A patch replaces the targeted row's whole `config` rather than merging into
# it, so a row whose value differs by mode does NOT live here: it belongs to
# each mode bundle, keeping any single row down to one bundle layer plus the
# user's. Mode-specific rows appear below only with shared plugin identity and
# neutral defaults; each mode bundle restates its complete configuration.
#
# Row order carries no load semantics (activation is service-availability
# driven); the grouping is for readers.

- insert:
    - id: tool-plugin-manager
      name: '@tomato/plugin-manager/tools'
      disabled: true

    - id: plugin-manager
      name: '@tomato/plugin-manager'
      disabled: !!js "!ctx.get('profileContext')"

    - id: timer
      name: '@tomato/cordis-plugin-timer'

    # Profile configuration reloads by default; module roots are opt-in.
    - id: hmr
      name: '@tomato/hmr'
      disabled: !!js "!ctx.get('profileContext')"
      config:
        root: []

    - id: llm
      name: '@tomato/llm'

    # Tomato AI serves only user-configured third-party model routes and
    # sends no official-provider request fields, so the official-API extension,
    # the session-log upload that rides on it, and the package inventory it
    # carries stay off.
    - id: deepseek-llm-api-extensions
      name: '@tomato/deepseek-llm-api-extensions'
      disabled: true

    - id: session
      name: '@tomato/session'

    - id: session-log-deepseek
      name: '@tomato/session-log-deepseek'
      disabled: true

    - id: typert
      name: '@tomato/typert-registry'

    - id: typert-loader
      name: '@tomato/typert-loader'

    - id: typert-gateway
      name: '@tomato/api-gateway'

    # Method-level access control for non-owner Peers; the Gateway requires it,
    # and its Client half publishes the standard access Hooks.
    - id: remote-access
      name: '@tomato/api-remote-access'

    - id: session-title
      name: '@tomato/session-title'
      config:
        fallbackMaxWords: 5
        fallbackMaxBytes: 40
        maxTitleBytes: 80

    - id: session-title-llm
      name: '@tomato/session-title-first-prompt-llm'
      config:
        targetWords: 5
        targetCjkCharacters: 10
        maxInputBytes: 4096
        # A ceiling against runaway output, not a length target: the prompt
        # keeps titles short, while reasoning a model cannot switch off also
        # counts as output. Stays within common model output limits.
        maxOutputTokens: 4096
        timeoutMs: 60000

    - id: user-questions
      name: '@tomato/user-questions'

    - id: agent
      name: '@tomato/agent'

    - id: plugin-package-inventory-deepseek
      name: '@tomato/plugin-package-inventory-deepseek'
      disabled: true

    # The transport-independent default for Agents created by entry points.
    # No model route ships in the base composition: the Models page creates
    # third-party OpenAI- or Anthropic-compatible routes. The empty pair means
    # there is no default until the user selects one; a new Session asks for a
    # model before its first message.
    - id: agent-default-model
      name: '@tomato/agent-default-model'
      config:
        provider: ''
        model: ''

    - id: jobs
      name: '@tomato/jobs-local'

    - id: llm-retry
      name: '@tomato/llm-retry'

    # Live Config forms persist through the active profile patch.

    # Live configuration forms persist through the launcher's profile.
    - id: config-editor
      name: '@tomato/config-editor'
      disabled: !!js "!ctx.get('profileContext')"

    - id: settings
      name: '@tomato/settings'
      disabled: !!js "!ctx.get('profileContext')"

    # Credential sources: managed `$TOMATO_HOME/.credentials.yaml`, then inherited
    # environment, project `.env`, and user `.env` fallbacks.
    # Adapters resolve references per request; the Models page writes only the
    # managed document, which is never materialized into the process environment.
    - id: authorization
      name: '@tomato/authorization'

    # Tomato AI authenticates through its own desktop token exchange, so
    # the DeepSeek account provider and its Platform sign-in flow stay off.
    - id: deepseek-account
      name: '@tomato/deepseek-account-platform'
      disabled: true

    - id: credentials
      name: '@tomato/credentials-local'

    # The pi-ai multi-provider twin. No route ships: the Models page's custom
    # form declares third-party endpoints and model catalogs, and stores each
    # key through the credential seam. A route can also be adopted from the
    # installed pi-ai catalog.
    - id: llm-pi-ai
      name: '@tomato/llm-pi-ai'

    - id: session-persistence-jsonl
      name: '@tomato/session-persistence-jsonl'
      config:
        root: !!js tomatoHomePath('sessions')

    # Durable image bytes live outside the append-only session log. Messages
    # keep content-addressed references that this shared backend resolves for
    # provider requests and authorized history reads.
    - id: attachment-local
      name: '@tomato/attachment-local'

    # Full-text session search is opt-in. `openAt: never` keeps
    # ctx.sessionQuery mounted — exact reads, titles, and lineage traces
    # (session export, subagent-fork Workspace inheritance) stay available —
    # while search calls fail with SESSION_QUERY_SEARCH_DISABLED and SQLite is
    # never opened; the Web sidebar search matches titles and workspace names
    # only. Deployments enabling content search override `openAt` to
    # `first-search` or `startup` in a later patch layer (profile
    # cordis.patch.yml or a --patch overlay), typically with a durable `path`.
    - id: session-query-sqlite
      name: '@tomato/session-query-sqlite'
      config:
        path: ':memory:'
        openAt: never

    # Shared projection registry: subagent catalog identity (mode/label) folds
    # through its registered units, so the `list_agents` surface below fails
    # loud without it; web layers reuse this same mount for list rows.
    - id: working-directory
      name: '@tomato/working-directory'

    - id: tool-working-directory
      name: '@tomato/tool-working-directory'

    - id: session-projection
      name: '@tomato/session-projection'

    # Durable KV storage: the storage hub, the json backend, and the
    # schema-validated domain form over them. Session-layer persistence (the
    # projection cache below; workspace in web layers)
    # routes through this stack, so it belongs to the shared base.
    - id: storage
      name: '@tomato/storage'

    - id: storage-json
      name: '@tomato/storage-json'
      config:
        root: !!js tomatoHomePath('storages')

    - id: storage-domain
      name: '@tomato/storage-domain'
      config:
        backend: json

    # Persisted projection cache: throttled write-behind over the
    # session_projcache domain (per-record layout — one version-stamped
    # checkpoint document per session), serving the session listing's
    # projection column.
    - id: session-projection-cache
      name: '@tomato/session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    # Tomato AI reports through its own OTLP relay plugin, so the
    # official session-log channel and its shared OTel service stay off.
    - id: otel
      name: '@tomato/otel'
      disabled: true

    # Tomato AI reports through its own OTLP relay plugin, so the official
    # session-log channel stays off. The shared `otel` service stays mounted
    # because the relay reuses it; disabling it would take the relay with it.
    - id: session-telemetry-otel
      name: '@tomato/session-telemetry-otel'
      disabled: true

    # Tomato AI's own reporter: turn and tool spans to the internal relay.
    # It derives spans from committed session events and sends nothing when its
    # endpoint is empty.
    - id: tomato-telemetry
      name: '@tomato/telemetry'
      config:
        endpoint: !!js process.env.TOMATO_OTLP_ENDPOINT ?? ''
        token: !!js process.env.TOMATO_OTLP_TOKEN
        serviceName: tomato-harness

    - id: subprocess
      name: '@tomato/subprocess-local'

    # Every shipped CLI mode starts with the same file-effect boundary.
    # The environment remains an explicit deployment override; otherwise fresh
    # sessions pin workspace-write + ask through the permission service below.
    - id: sandbox
      name: '@tomato/sandbox-local'

    - id: sandbox-policy
      name: '@tomato/sandbox-policy'
      config:
        mode: !!js process.env.TOMATO_PERMISSION_MODE ?? 'workspace-write'
        workspaceRoot: !!js process.cwd()

    - id: bash-sandbox
      name: '@tomato/bash-sandbox'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 60000

    - id: pwsh-sandbox
      name: '@tomato/pwsh-sandbox'
      disabled: !!js process.platform !== 'win32'

    - id: approval
      name: '@tomato/user-approval'
      config:
        policy: !!js "(process.env.TOMATO_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"

    - id: permission
      name: '@tomato/permission-presets'
      config:
        presets:
          read-only:
            sandbox: read-only
            approval: ask
          workspace-write:
            sandbox: workspace-write
            approval: ask
          danger-full-access:
            sandbox: danger-full-access
            approval: never

    - id: shell-env
      name: '@tomato/shell-env'

    - id: tool-bash
      name: '@tomato/tool-bash'
      disabled: !!js process.platform === 'win32'

    - id: tool-pwsh
      name: '@tomato/tool-pwsh'
      disabled: !!js process.platform !== 'win32'

    - id: tool-jobs
      name: '@tomato/tool-jobs'

    - id: fs-observation-policy
      name: '@tomato/fs-observation-policy'

    - id: tool-fs
      name: '@tomato/tool-fs'

    - id: tool-fs-search
      name: '@tomato/tool-fs-search'
      config:
        sampleOverCapGlobResults: false

    - id: agent-instructions
      name: '@tomato/agent-instructions'
      config:
        maxBytes: 65536

    - id: skill
      name: '@tomato/skill'

    - id: skill-filesystem
      name: '@tomato/skill-filesystem'

    - id: tool-skill
      name: '@tomato/tool-skill'

    - id: commands
      name: '@tomato/commands'

    - id: command-feedback
      name: '@tomato/command-feedback'

    - id: goal
      name: '@tomato/goal'

    - id: goal-round-driver
      name: '@tomato/goal-round-driver'

    - id: command-goal
      name: '@tomato/command-goal'

    - id: plan-mode
      name: '@tomato/plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed only to keep the request shape stable. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

    - id: token-meter
      name: '@tomato/token-meter'

    - id: compaction-basic
      name: '@tomato/compaction-basic'

    # Human `/compact`: one useful reduction below the automatic threshold. Backend
    # independent, so it follows whichever compaction service this leaf mounts.
    - id: command-compact
      name: '@tomato/command-compact'

    - id: subagent
      name: '@tomato/subagent'

    - id: subagent-spawn-in-process
      name: '@tomato/subagent-spawn-in-process'
      config:
        providerName: spawn

    - id: subagent-fork-in-process
      name: '@tomato/subagent-fork-in-process'
      config:
        providerName: fork

    # Continuable background children are selected per delegation tool. The
    # separately loaded follow-up tool registers the one global `send_message`.
    - id: tool-subagent-control
      name: '@tomato/tool-subagent-control'

    - id: tool-subagent
      name: '@tomato/tool-subagent'
      config:
        provider: spawn
        toolName: subagent

    # Fork omits model-selection arguments for KV Cache reuse. Parent and child
    # share the messaging tools; return guidance follows the inherited history.
    # See packages/subagent/tool-subagent/README.md
    # and .agents/notes/implemented/architecture/2026-08-10-fork-children-stay-one-shot.md.
    - id: tool-subagent-fork
      name: '@tomato/tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork

    - id: ptc-runtime
      name: '@tomato/ptc-runtime-node'

    - id: workflow-ptc
      name: '@tomato/workflow-ptc'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@tomato/tool-workflow'

    - id: timeout-policy
      name: '@tomato/tool-call-timeout-policy'

    - id: spill-local
      name: '@tomato/spill-local'

    - id: spill-policy
      name: '@tomato/spill-policy'
      config:
        maxInlineTokens: 12500

    # Durability checkpoints before each model request and top-level dispatch.
    - id: session-checkpoint-policy
      name: '@tomato/session-checkpoint-policy'

    # Compacts oversized tool results before the broader conversation compactor
    # runs, preserving the model-visible result within the configured budget.
    - id: tool-result-pruner
      name: '@tomato/compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

    # When an image-capable route rejects a request as over its image budget,
    # replace the oldest images with placeholders on the surface and retry.
    - id: image-offload
      name: '@tomato/compaction-image-offload'

    - id: tool-todo
      name: '@tomato/tool-todo'
      config:
        allowParallelInProgress: true

    # Persisted same-session goals reach the model and the slash menu here; the
    # domain, driver, and `/goal` command are above.
    - id: tool-goal
      name: '@tomato/tool-goal'

    # Consecutive-repeat reminders on the tool chain.
    - id: repeat-tool-reminder
      name: '@tomato/repeat-tool-reminder'
      config:
        thresholds: [3, 5, 8]
        argumentsPreviewChars: 500

    # The shared base enables the stable model-facing web_search and web_fetch
    # tools. The Web app disables this host row and composes both tools per agent
    # preset; products with a stricter network policy override tool-web. DeepSeek
    # search resolves the same DEEPSEEK_API_KEY
    # credential the Models page manages for chat, at each search; its Messages
    # endpoint is configured independently from the model route, so it takes its own
    # base-URL override. Anonymous fetch accepts only public HTTP(S) destinations,
    # resolves and validates every destination, and pins every actual connection.
    # Search is a full auxiliary model request with server-side retrieval, so this
    # shipped DeepSeek route gets 60s while the provider-neutral tool default
    # remains 30s. The DeepSeek Search and Fetch APIs register as
    # deepseek-search-api and deepseek-fetch-api with the same credential; the Web
    # search settings switch selects both in place of these defaults.
    # Tomato AI keeps web fetch only: the DeepSeek search backend needs an
    # official-provider credential this deployment never holds, so both its
    # search providers stay off and `search()` reports its own unavailable code
    # when called.
    - id: web
      name: '@tomato/web'
      config:
        fetchProvider: http

    - id: web-search-deepseek
      name: '@tomato/web-search-deepseek'
      disabled: true

    - id: web-deepseek-api
      name: '@tomato/web-deepseek-api'
      disabled: true

    - id: web-fetch-http
      name: '@tomato/web-fetch-http'

    - id: tool-web
      name: '@tomato/tool-web'
      config:
        fetch: true
        searchTimeoutMs: 60000

    - id: mcp-resources
      name: '@tomato/mcp-resources'

    # ── rows every mode mounts, whose values each overlay may state ──────────────

    # Shared tool definitions and the deployment’s native executor.
    - id: tools
      name: '@tomato/tools'

    - id: tool-executor-native
      name: '@tomato/tool-executor-native'

    - id: tool-executor-ptc
      name: '@tomato/tool-executor-ptc'
      disabled: true

    # The deployment persona is a deployment choice; plan-mode and tool plugins own
    # their own prompt sections.
    - id: system-prompt
      name: '@tomato/system-prompt'
      config:
        personaPrefix: ''

    # Agents created at startup. The base stays empty; raw overlays may create
    # agents, while Web creates sessions on client request.
    - id: agent-loop
      name: '@tomato/agent-loop'
      config:
        agents: []

    # The sandboxed filesystem provider. `cwd` defaults to `process.cwd()`; an
    # overlay can pin another workspace.
    - id: fs-sandbox
      name: '@tomato/fs-sandbox'

    # Tomato AI serves models only through user-configured third-party routes
    # on `llm-pi-ai`; the official DeepSeek adapters and their account sign-in
    # stay off.
    - id: llm-deepseek
      name: '@tomato/llm-deepseek-api-key'
      disabled: true

    - id: llm-deepseek-account
      name: '@tomato/llm-deepseek-account'
      disabled: true
