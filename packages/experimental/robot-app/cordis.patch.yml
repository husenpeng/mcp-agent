# The Tomato Rbot bundle. The registry stores specifications, robots, and runs
# in the `tomato_robot` storage domain; the runtime executes queued runs through
# one Agent per run and records the run's Session; triggers start runs for cron
# and event schedules; the template registry lists hireable starting points and
# the marketing row contributes eleven of them; the controller exposes the
# registry over the `robot` Remote namespace; the page renders the template
# cards, the roster, the specification editor, and a conversation surface
# separate from workspace chats; the model-facing create and update tools
# publish what a confirmed interview collected, and the bundled creation and
# grilling skills guide that interview. The page row is inert without a Web
# host and renders only while `ctx.robotRuns` is mounted.
#
# No shipped profile template selects this optional bundle, so selecting it is
# the opt-in that mounts these rows; individual rows stay switchable afterward.
# The crew workflow (canvas, group-chat tab, crew providers, and the agent crew
# tool) is its own optional layer: `@tomato/experimental-robot-crew-bundle`.
- insert:
    - id: robot-local
      name: '@tomato/experimental-robot-local'

    - id: robot-templates
      name: '@tomato/experimental-robot/templates'

    - id: robot-templates-marketing
      name: '@tomato/experimental-robot-templates-marketing'

    - id: robot-templates-knowledge-work
      name: '@tomato/experimental-robot-templates-knowledge-work'

    - id: robot-runtime
      name: '@tomato/experimental-robot-runtime'

    - id: robot-triggers
      name: '@tomato/experimental-robot-triggers'

    - id: robot-remote
      name: '@tomato/experimental-robot-remote'

    - id: api-robot-controller
      name: '@tomato/api-robot-controller'

    - id: ui-robot
      name: '@tomato/client-ui-robot'

    - id: robot-skill
      name: '@tomato/experimental-robot-app'

    - id: robot-tool
      name: '@tomato/experimental-tool-robot'

    - id: robot-room-local
      name: '@tomato/experimental-robot-room-local'

    - id: robot-room-remote
      name: '@tomato/experimental-robot-room-remote'

    - id: api-robot-room-controller
      name: '@tomato/api-robot-room-controller'

    - id: ui-robot-room
      name: '@tomato/client-ui-robot-room'