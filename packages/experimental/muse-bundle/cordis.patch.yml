- insert:
    - id: optional-memory
      name: '@tomato/experimental-memory'

    - id: optional-embeddings-http
      name: '@tomato/experimental-embeddings-http'
      disabled: true
      config:
        baseUrl: http://127.0.0.1:11434/v1
        model: nomic-embed-text
        dimensions: 768

    - id: optional-tool-memory
      name: '@tomato/experimental-tool-memory'
      config:
        # Turn-end capture is the feature; deployments narrow the route to a
        # cheap model where the conversation model is expensive.
        capture: true

    - id: optional-memory-dream
      name: '@tomato/memory-dream'
      disabled: true
      config:
        # Offline consolidation: report mode by default, enable when ready.
        enabled: false
        applyMode: report

    - id: optional-focus
      name: '@tomato/experimental-focus'

    - id: optional-muse-insights
      name: '@tomato/experimental-muse-insights'
