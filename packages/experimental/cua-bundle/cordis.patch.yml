- insert:
    - id: cua-provider-registry
      name: '@tomato/computer-use'
    - id: cua
      name: '@tomato/experimental-cua-macos'
      disabled: !!js process.platform !== 'darwin'
      config:
        agentPreset: ptc
    - id: cua-windows
      name: '@tomato/cua-windows'
      disabled: !!js process.platform !== 'win32'
      config:
        agentPreset: ptc
    - id: ui-cua
      name: '@tomato/cua'
