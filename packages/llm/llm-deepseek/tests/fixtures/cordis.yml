- name: '@tomato/llm'
- name: '@tomato/session'
- name: '@tomato/session-projection'
- name: '@tomato/system-prompt'
- name: '@tomato/tools'
- name: '@tomato/tool-executor-native'
- name: '@tomato/agent'
- name: '@tomato/agent-loop'
  config:
    agents: []
- name: '@tomato/credentials-local'
  config:
    path: {{credentials}}
    watch: false
- name: '@tomato/llm-deepseek-api-key'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: {{endpoint}}
    thinking: enabled
    reasoningEffort: high
    maxTokens: 256000
    streamIdleTimeoutMs: 300000
- name: '@tomato/llm-deepseek-account'
  config:
    baseURL: {{endpoint}}
