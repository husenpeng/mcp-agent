# Workspace-context snapshot patch: the harness exports TOMATO_HOME=<cwd>/.tomato and
# TOMATO_AGENTS_HOME=<cwd>/.agents, so project-root and both user-global root
# discoveries stay inside the scenario's temporary cwd.
- id: agent-default-model
  name: '@tomato/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@tomato/session-persistence-jsonl'
  config:
    root: !!js tomatoHomePath('sessions')
    compression: !!js 'process.env.TOMATO_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@tomato/agent-instructions'
  config:
    maxBytes: 700
    projectRootMarkers:
      - .tomato-project

- id: system-prompt
  name: '@tomato/system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.
