- insert:
    - id: office-kit
      name: '@tomato/office-kit'
      config:
        outputDirectory: !!js tomatoHomePath('office-kit', 'outputs')

    - id: tool-office
      name: '@tomato/tool-office'

    - id: skill-office
      name: '@tomato/skill-office'
      config:
        assetRoot: !!js process.cwd() + '/office-skills'
        pythonEnvironment: user

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true
