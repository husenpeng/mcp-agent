# Keyless PTC mode combines the runtime/registry changes with the
# DeepSeek-to-replay swap in one profile patch.
- insert:
    - id: literal-sdk
      name: '../../../packages/core/tools/tests/fixtures/literal-sdk.ts'

- id: llm-deepseek
  name: '@tomato/llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: agent-default-model
  name: '@tomato/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@tomato/session-persistence-jsonl'
  config:
    root: !!js tomatoHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@tomato/agent-instructions'
  config:
    maxBytes: 65536

- id: tool-executor-native
  disabled: true

- id: tool-executor-ptc
  disabled: false

# The runtime mounts after the executor, which waits for its required service.
- id: ptc-runtime
  disabled: true

- insert:
    - id: ptc-runtime-late
      name: '@tomato/ptc-runtime-node'

- id: system-prompt
  name: '@tomato/system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@tomato/llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
