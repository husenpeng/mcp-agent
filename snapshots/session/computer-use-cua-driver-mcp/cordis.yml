- id: agent-default-model
  name: '@tomato/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash-vision-exp

- id: session-persistence-jsonl
  name: '@tomato/session-persistence-jsonl'
  config:
    root: !!js tomatoHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@tomato/agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@tomato/system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- id: attachment-local
  name: '@tomato/attachment-local'

- insert:
    - id: computer-use
      name: '@tomato/computer-use'
    - id: computer-use-cua-driver-mcp
      name: '@tomato/experimental-computer-use-cua-driver-mcp'
      config:
        command: !!js process.execPath
        args: [driver.mjs, .tomato/computer-use-fixture]
        reconnect:
          enabled: false
