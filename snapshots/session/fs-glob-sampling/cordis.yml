# Minimal live counterpart for the glob-sampling snapshot composition.
- id: llm-deepseek
  name: '@tomato/llm-deepseek-api-key'
  config:
    models:
      - id: deepseek-v4-pro

- id: subprocess
  name: '@tomato/subprocess-local'

- id: agent-default-model
  name: '@tomato/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@tomato/session-persistence-jsonl'
  config:
    root: !!js tomatoHomePath('sessions')
    compression: !!js 'process.env.TOMATO_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@tomato/agent-instructions'
  disabled: true

- id: system-prompt
  name: '@tomato/system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent.

- id: tool-jobs
  name: '@tomato/tool-jobs'
  disabled: true

- id: goal
  name: '@tomato/goal'
  disabled: true

- id: goal-round-driver
  name: '@tomato/goal-round-driver'
  disabled: true

- id: command-goal
  name: '@tomato/command-goal'
  disabled: true

- id: tool-goal
  name: '@tomato/tool-goal'
  disabled: true

- id: skill
  name: '@tomato/skill'
  disabled: true

- id: skill-filesystem
  name: '@tomato/skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@tomato/tool-skill'
  disabled: true

- id: tool-fs-search
  name: '@tomato/tool-fs-search'
  config:
    sampleOverCapGlobResults: true
    globMaxResults: 4

- id: spill-local
  name: '@tomato/spill-local'
  config:
    root: !!js process.env.TOMATO_SNAPSHOT_SPILL_ROOT ?? './.spill'

- insert:
    - id: snapshot-spill-locators
      name: ../../../scripts/snapshot-spill-locators.ts
      config:
        root: !!js process.env.TOMATO_SNAPSHOT_SPILL_ROOT
        locatorRoot: !!js process.env.TOMATO_SNAPSHOT_SPILL_LOCATOR_ROOT
