# The parent owns its file and web tools; the child selects a separate preset.
- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: tool-web
  disabled: true

- insert:
    - id: agent-preset-registry
      name: '@tomato/agent-preset-registry'
      config:
        default: parent
    - id: preset-parent
      name: '@tomato/agent-preset'
      config:
        id: parent
        plugins:
          - name: '@tomato/tool-fs'
          - name: '@tomato/tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - name: '@tomato/tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
    - id: preset-child
      name: '@tomato/agent-preset'
      config:
        id: child
        plugins: []
    - id: parent-agent-preset
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/parent-agent-preset.ts'

- id: tool-subagent
  name: '@tomato/tool-subagent'
  inject: [agentPresets]
  config:
    provider: spawn
    toolName: subagent
    maxDepth: 1
    agentPreset: child
