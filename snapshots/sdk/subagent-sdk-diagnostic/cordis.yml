# TypeScript SDK snapshot patch for automatic TOMATO SDK failure notices.

- id: skill-filesystem
  name: '@tomato/skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-deepseek
  name: '@tomato/llm-deepseek-api-key'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@tomato/session-persistence-jsonl'
  config:
    root: !!js tomatoHomePath('sessions')
    compression: !!js "process.env.TOMATO_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: session-log-deepseek
  name: '@tomato/session-log-deepseek'
  config:
    enabled: true

- insert:
    - id: subagent-sdk-diagnostic
      name: '@tomato/subagent-sdk'
      config:
        providerName: tomato-sdk-diagnostic
        profile: sdk
        patches:
          - !!js process.env.TOMATO_TEST_CHILD_PATCH
        tomatoHome: !!js tomatoHomePath('children/first')
        provider: mock
        model: mock-echo
        env:
          TOMATO_TELEMETRY_DISABLED: '1'
          TOMATO_TEST_CHILD_FAILURE: '1'
    - id: tool-subagent-sdk-diagnostic
      name: '@tomato/tool-subagent'
      config:
        provider: tomato-sdk-diagnostic
        toolName: subagent_dsh_sdk
        maxDepth: provider-managed
    - id: subagent-sdk-diagnostic-second
      name: '@tomato/subagent-sdk'
      config:
        providerName: tomato-sdk-diagnostic-second
        profile: sdk
        patches:
          - !!js process.env.TOMATO_TEST_CHILD_PATCH
        tomatoHome: !!js tomatoHomePath('children/second')
        provider: mock
        model: mock-echo
        env:
          TOMATO_TELEMETRY_DISABLED: '1'
          TOMATO_TEST_CHILD_FAILURE: '1'
    - id: tool-subagent-sdk-diagnostic-second
      name: '@tomato/tool-subagent'
      config:
        provider: tomato-sdk-diagnostic-second
        toolName: subagent_dsh_sdk_second
        maxDepth: provider-managed
    - id: await-external-subagents
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/subagent-settlement-barrier.ts'
