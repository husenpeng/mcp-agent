# TypeScript SDK snapshot-record patch over `tomato --profile sdk`.

# The fixture corpus must not depend on the developer's personal skill roots.
# Ordinary product launches retain the sdk profile's default skill discovery.
- id: skill-filesystem
  name: '@tomato/skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-deepseek
  name: '@tomato/llm-deepseek-api-key'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@tomato/session-persistence-jsonl'
  config:
    root: !!js tomatoHomePath('sessions')
    compression: !!js "process.env.TOMATO_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: tool-subagent
  name: '@tomato/tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    maxDepth: 1

- id: session-log-deepseek
  name: '@tomato/session-log-deepseek'
  config:
    enabled: true

- insert:
    - id: serial-created-fixture
      name: '../../../packages/core/agent-loop/tests/fixtures/serial-created.mjs'
