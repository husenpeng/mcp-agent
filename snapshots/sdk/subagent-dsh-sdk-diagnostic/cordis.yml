# TypeScript SDK snapshot patch for automatic TOMATO SDK failure notices.

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js tomatoHomePath('sessions')
    compression: !!js "process.env.TOMATO_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: session-log-deepseek
  name: '@deepseek-ai/dsh-session-log-deepseek'
  config:
    enabled: true

- insert:
    - id: subagent-dsh-sdk-diagnostic
      name: '@deepseek-ai/dsh-subagent-dsh-sdk'
      config:
        providerName: dsh-sdk-diagnostic
        profile: sdk
        patches:
          - !!js process.env.TOMATO_TEST_CHILD_PATCH
        tomatoHome: !!js tomatoHomePath('children/first')
        provider: mock
        model: mock-echo
        env:
          TOMATO_TELEMETRY_DISABLED: '1'
          TOMATO_TEST_CHILD_FAILURE: '1'
    - id: tool-subagent-dsh-sdk-diagnostic
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: dsh-sdk-diagnostic
        toolName: subagent_dsh_sdk
        maxDepth: provider-managed
    - id: subagent-dsh-sdk-diagnostic-second
      name: '@deepseek-ai/dsh-subagent-dsh-sdk'
      config:
        providerName: dsh-sdk-diagnostic-second
        profile: sdk
        patches:
          - !!js process.env.TOMATO_TEST_CHILD_PATCH
        tomatoHome: !!js tomatoHomePath('children/second')
        provider: mock
        model: mock-echo
        env:
          TOMATO_TELEMETRY_DISABLED: '1'
          TOMATO_TEST_CHILD_FAILURE: '1'
    - id: tool-subagent-dsh-sdk-diagnostic-second
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: dsh-sdk-diagnostic-second
        toolName: subagent_dsh_sdk_second
        maxDepth: provider-managed
    - id: await-external-subagents
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/subagent-settlement-barrier.ts'
