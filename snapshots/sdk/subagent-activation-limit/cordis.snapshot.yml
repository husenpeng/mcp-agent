# Keyless activation-capacity overlay holds the first child until the parent finishes.
- id: llm-deepseek
  name: '@tomato/llm-deepseek-api-key'
  disabled: true

- id: agent-default-model
  name: '@tomato/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@tomato/session-persistence-jsonl'
  config:
    root: !!js tomatoHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@tomato/agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@tomato/system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- id: sandbox
  name: '@tomato/sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@tomato/llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
    - id: subagent-activation-limit
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/subagent-activation-limit.ts'

- id: subagent
  name: '@tomato/subagent'
  config:
    maxActiveSubagents: 8
